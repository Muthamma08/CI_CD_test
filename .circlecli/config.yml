#circlecli for calculator.py
- version: 2.1
  jobs:
    build:
      docker:
        - image: cimg/python:3.8
      steps:
        - checkout
        - run:
            name: Install dependencies
            command: |
              python -m venv venv
              . venv/bin/activate
              pip install -r requirements.txt
        - run:
            name: Run tests
            command: |
              . venv/bin/activate
              pytest CI_CD_test/calculator_test.py
              flake8 CI_CD_test/calculator.py
